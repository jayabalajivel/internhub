<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 850 420' width='100%' height='100%'>
  <defs>
    <marker id='arrow' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 10 5 L 0 9 z' fill='#1e3a8a'/>
    </marker>
    <filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='2' dy='3' stdDeviation='3' flood-color='#94a3b8' flood-opacity='0.4'/>
    </filter>
  </defs>
  <rect width='100%' height='100%' fill='#ffffff'/>
  
  <!-- Central Process -->
  <circle cx='425' cy='210' r='90' fill='#eff6ff' stroke='#1e40af' stroke-width='3' filter='url(#shadow)'/>
  <text x='425' y='195' font-family='Arial, sans-serif' font-size='14' font-weight='bold' fill='#1e3a8a' text-anchor='middle'>0.0</text>
  <text x='425' y='215' font-family='Arial, sans-serif' font-size='15' font-weight='bold' fill='#0f172a' text-anchor='middle'>INTERNHUB SYSTEM</text>
  <text x='425' y='235' font-family='Arial, sans-serif' font-size='12' fill='#475569' text-anchor='middle'>(AI Core Platform)</text>
  
  <!-- External Entity: Student User -->
  <rect x='40' y='140' width='170' height='140' rx='8' fill='#f8fafc' stroke='#334155' stroke-width='2' filter='url(#shadow)'/>
  <path d='M 125 185 a 18 18 0 1 0 0 -36 a 18 18 0 0 0 0 36 M 105 210 c 0 -12 40 -12 40 0 v 10 h -40 z' fill='#475569'/>
  <text x='125' y='240' font-family='Arial, sans-serif' font-size='14' font-weight='bold' fill='#0f172a' text-anchor='middle'>Student / Candidate</text>
  <text x='125' y='258' font-family='Arial, sans-serif' font-size='11' fill='#64748b' text-anchor='middle'>[External Entity]</text>
  
  <!-- External Entity: External Job APIs -->
  <rect x='640' y='50' width='180' height='130' rx='8' fill='#f0fdf4' stroke='#166534' stroke-width='2' filter='url(#shadow)'/>
  <text x='730' y='85' font-family='Arial, sans-serif' font-size='14' font-weight='bold' fill='#14532d' text-anchor='middle'>Live Recruitment APIs</text>
  <text x='730' y='108' font-family='Arial, sans-serif' font-size='11' fill='#15803d' text-anchor='middle'>• Adzuna API</text>
  <text x='730' y='125' font-family='Arial, sans-serif' font-size='11' fill='#15803d' text-anchor='middle'>• Jooble API</text>
  <text x='730' y='142' font-family='Arial, sans-serif' font-size='11' fill='#15803d' text-anchor='middle'>• JobDataAPI / Remotive</text>
  <text x='730' y='162' font-family='Arial, sans-serif' font-size='11' fill='#475569' text-anchor='middle'>[External Entity]</text>
  
  <!-- External Entity: Supabase Cloud Database -->
  <rect x='640' y='240' width='180' height='130' rx='8' fill='#fdf4ff' stroke='#86198f' stroke-width='2' filter='url(#shadow)'/>
  <text x='730' y='280' font-family='Arial, sans-serif' font-size='14' font-weight='bold' fill='#701a75' text-anchor='middle'>Supabase Cloud</text>
  <text x='730' y='300' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#701a75' text-anchor='middle'>PostgreSQL Database</text>
  <text x='730' y='325' font-family='Arial, sans-serif' font-size='11' fill='#a21caf' text-anchor='middle'>Row Level Security (RLS)</text>
  <text x='730' y='345' font-family='Arial, sans-serif' font-size='11' fill='#475569' text-anchor='middle'>[Data Store / Identity]</text>
  
  <!-- Data Flow Lines: User to System -->
  <path d='M 210 180 L 332 180' stroke='#1e3a8a' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='270' y='172' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#1e3a8a' text-anchor='middle'>PDF Resume &amp; Skills</text>
  
  <path d='M 210 220 L 332 220' stroke='#1e3a8a' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='270' y='214' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#1e3a8a' text-anchor='middle'>Job Filters &amp; Tracking</text>
  
  <!-- Data Flow Lines: System to User -->
  <path d='M 335 245 L 210 245' stroke='#059669' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='270' y='260' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#059669' text-anchor='middle'>Ranked Matches &amp; Scores</text>
  
  <!-- Data Flow Lines: System <-> APIs -->
  <path d='M 495 150 L 640 100' stroke='#1e3a8a' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='570' y='115' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#1e3a8a' text-anchor='middle'>Query Search</text>
  
  <path d='M 640 130 L 515 170' stroke='#166534' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='585' y='160' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#166534' text-anchor='middle'>Raw Live Listings</text>
  
  <!-- Data Flow Lines: System <-> DB -->
  <path d='M 515 250 L 640 280' stroke='#1e3a8a' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='580' y='260' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#1e3a8a' text-anchor='middle'>Save Profile/Apps</text>
  
  <path d='M 640 310 L 495 275' stroke='#86198f' stroke-width='2' marker-end='url(#arrow)'/>
  <text x='575' y='315' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#86198f' text-anchor='middle'>Authenticated Fetch</text>
</svg>