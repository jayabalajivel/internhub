<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 520' width='100%' height='100%'>
  <defs>
    <marker id='arrow1' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 10 5 L 0 9 z' fill='#2563eb'/>
    </marker>
  </defs>
  <rect width='100%' height='100%' fill='#ffffff'/>
  
  <!-- Entity User -->
  <rect x='30' y='180' width='140' height='100' rx='8' fill='#f1f5f9' stroke='#475569' stroke-width='2'/>
  <text x='100' y='225' font-family='Arial, sans-serif' font-size='13' font-weight='bold' fill='#0f172a' text-anchor='middle'>Student User</text>
  <text x='100' y='245' font-family='Arial, sans-serif' font-size='11' fill='#64748b' text-anchor='middle'>[Candidate]</text>

  <!-- Process 1.0 Auth -->
  <rect x='250' y='30' width='160' height='70' rx='8' fill='#eff6ff' stroke='#3b82f6' stroke-width='2'/>
  <text x='330' y='60' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#1d4ed8' text-anchor='middle'>1.0 User Authentication</text>
  <text x='330' y='78' font-family='Arial, sans-serif' font-size='10' fill='#1e40af' text-anchor='middle'>&amp; Profile Provisioning</text>

  <!-- Process 2.0 Resume Parsing -->
  <rect x='250' y='140' width='160' height='70' rx='8' fill='#eff6ff' stroke='#3b82f6' stroke-width='2'/>
  <text x='330' y='170' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#1d4ed8' text-anchor='middle'>2.0 Resume Ingestion</text>
  <text x='330' y='188' font-family='Arial, sans-serif' font-size='10' fill='#1e40af' text-anchor='middle'>&amp; NLP Skill Extraction</text>

  <!-- Process 3.0 Live Aggregator -->
  <rect x='520' y='30' width='160' height='70' rx='8' fill='#f0fdf4' stroke='#22c55e' stroke-width='2'/>
  <text x='600' y='60' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#15803d' text-anchor='middle'>3.0 Multi-API Aggregator</text>
  <text x='600' y='78' font-family='Arial, sans-serif' font-size='10' fill='#166534' text-anchor='middle'>Deduplication &amp; Trust</text>

  <!-- Process 4.0 Recommendation Engine -->
  <rect x='520' y='170' width='160' height='80' rx='8' fill='#fffbeb' stroke='#f59e0b' stroke-width='2'/>
  <text x='600' y='200' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#b45309' text-anchor='middle'>4.0 Multi-Factor Hybrid</text>
  <text x='600' y='218' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#b45309' text-anchor='middle'>Recommendation Engine</text>
  <text x='600' y='235' font-family='Arial, sans-serif' font-size='9' fill='#78350f' text-anchor='middle'>(50% Core + 20% Role + 15% Pref)</text>

  <!-- Process 5.0 Skill-Gap -->
  <rect x='250' y='260' width='160' height='70' rx='8' fill='#eff6ff' stroke='#3b82f6' stroke-width='2'/>
  <text x='330' y='290' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#1d4ed8' text-anchor='middle'>5.0 Skill-Gap Diagnostics</text>
  <text x='330' y='308' font-family='Arial, sans-serif' font-size='10' fill='#1e40af' text-anchor='middle'>&amp; Roadmap Generator</text>

  <!-- Process 6.0 App Tracker -->
  <rect x='250' y='380' width='160' height='70' rx='8' fill='#eff6ff' stroke='#3b82f6' stroke-width='2'/>
  <text x='330' y='410' font-family='Arial, sans-serif' font-size='11' font-weight='bold' fill='#1d4ed8' text-anchor='middle'>6.0 Application Lifecycle</text>
  <text x='330' y='428' font-family='Arial, sans-serif' font-size='10' fill='#1e40af' text-anchor='middle'>Tracker &amp; Saved Jobs</text>

  <!-- Data Stores -->
  <path d='M 740 180 h 120 M 740 220 h 120' stroke='#0f172a' stroke-width='2'/>
  <text x='800' y='205' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#0f172a' text-anchor='middle'>D1: profiles</text>

  <path d='M 740 60 h 120 M 740 100 h 120' stroke='#0f172a' stroke-width='2'/>
  <text x='800' y='85' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#0f172a' text-anchor='middle'>D2: internships_cache</text>

  <path d='M 740 400 h 120 M 740 440 h 120' stroke='#0f172a' stroke-width='2'/>
  <text x='800' y='425' font-family='Arial, sans-serif' font-size='10' font-weight='bold' fill='#0f172a' text-anchor='middle'>D3: applications &amp; saved</text>

