  <path d='M 170 200 L 250 70' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow1)'/>
  <path d='M 170 220 L 250 170' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow1)'/>
  <path d='M 170 240 L 250 400' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow1)'/>

