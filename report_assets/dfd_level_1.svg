  <path d='M 680 70 L 740 70' stroke='#22c55e' stroke-width='1.5' marker-end='url(#arrow1)'/>

  <path d='M 740 90 L 680 180' stroke='#22c55e' stroke-width='1.5' marker-end='url(#arrow1)'/>
  <path d='M 740 200 L 680 200' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow1)'/>

  <path d='M 520 220 L 170 230' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow1)'/>
  <path d='M 520 230 L 410 280' stroke='#d97706' stroke-width='1.5' marker-end='url(#arrow1)'/>
  <path d='M 250 300 L 170 250' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow1)'/>
  <path d='M 410 415 L 740 415' stroke='#2563eb' stroke-width='1.5' marker-end='url(#arrow1)'/>
