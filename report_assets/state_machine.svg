<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 240' width='100%' height='100%'>
  <defs>
    <marker id='sm_arrow' viewBox='0 0 10 10' refX='6' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
      <path d='M 0 1 L 10 5 L 0 9 z' fill='#334155'/>
    </marker>
  </defs>
  <rect width='100%' height='100%' fill='#ffffff'/>
  
  <circle cx='50' cy='120' r='12' fill='#0f172a'/>
  <path d='M 62 120 L 105 120' stroke='#334155' stroke-width='2' marker-end='url(#sm_arrow)'/>

  <!-- Saved -->
  <rect x='110' y='95' width='100' height='50' rx='6' fill='#f1f5f9' stroke='#64748b' stroke-width='2'/>
  <text x='160' y='125' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#1e293b' text-anchor='middle'>Saved</text>

  <path d='M 210 120 L 255 120' stroke='#334155' stroke-width='2' marker-end='url(#sm_arrow)'/>

  <!-- Applied -->
  <rect x='260' y='95' width='100' height='50' rx='6' fill='#eff6ff' stroke='#3b82f6' stroke-width='2'/>
  <text x='310' y='125' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#1d4ed8' text-anchor='middle'>Applied</text>

  <path d='M 360 120 L 415 120' stroke='#334155' stroke-width='2' marker-end='url(#sm_arrow)'/>

  <!-- Interview -->
  <rect x='420' y='95' width='100' height='50' rx='6' fill='#fffbeb' stroke='#f59e0b' stroke-width='2'/>
  <text x='470' y='125' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#b45309' text-anchor='middle'>Interview</text>

  <!-- Branches to Final Outcomes -->
  <path d='M 520 110 L 615 55' stroke='#16a34a' stroke-width='2' marker-end='url(#sm_arrow)'/>
  <path d='M 520 120 L 615 120' stroke='#dc2626' stroke-width='2' marker-end='url(#sm_arrow)'/>
  <path d='M 520 130 L 615 185' stroke='#64748b' stroke-width='2' marker-end='url(#sm_arrow)'/>

  <!-- Selected -->
  <rect x='620' y='30' width='120' height='45' rx='6' fill='#f0fdf4' stroke='#16a34a' stroke-width='2'/>
  <text x='680' y='58' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#15803d' text-anchor='middle'>Selected (Offer!)</text>

  <!-- Rejected -->
  <rect x='620' y='98' width='120' height='45' rx='6' fill='#fef2f2' stroke='#ef4444' stroke-width='2'/>
  <text x='680' y='126' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#b91c1c' text-anchor='middle'>Rejected</text>

  <!-- Withdrawn -->
  <rect x='620' y='165' width='120' height='45' rx='6' fill='#f8fafc' stroke='#94a3b8' stroke-width='2'/>
  <text x='680' y='193' font-family='Arial, sans-serif' font-size='12' font-weight='bold' fill='#475569' text-anchor='middle'>Withdrawn</text>
</svg>